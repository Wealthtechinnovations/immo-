name: Governance
on:
  pull_request:
  push:
    branches: [Server]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: npm run ready
      - run: node --test mcp/connectors/sigfu/test.mjs
