services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: coica
      POSTGRES_USER: coica
      POSTGRES_PASSWORD: coica_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coica -d coica"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - coica_pg:/var/lib/postgresql/data
volumes:
  coica_pg:
